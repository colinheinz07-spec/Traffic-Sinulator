name: Shared junction receiving and backpressure
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/network-receiving.ts'
      - 'src/spatial.ts'
      - 'src/app.ts'
      - 'tests/shared-interchange-receiving.test.mjs'
      - '.github/workflows/shared-junction-receiving.yml'
jobs:
  receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/shared-interchange-receiving.test.mjs tests/receiving-capacity-pooling.test.mjs tests/network-merge-receiving.test.mjs
