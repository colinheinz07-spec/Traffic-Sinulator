name: Import A3 Koeln-Ost to AK Leverkusen and local OSM bypasses
on:
  push:
    branches: [feature/a3-leverkusen-network-20261105]
    paths:
      - scripts/import_a3_leverkusen.py
      - scripts/build_a3_leverkusen_detours.py
      - scripts/publish_a3_leverkusen_objects.py
      - scripts/extend_a1_leverkusen.py
      - .github/workflows/import-a3-leverkusen.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local importer syntax
        run: python -m py_compile scripts/import_a3_leverkusen.py scripts/build_a3_leverkusen_detours.py scripts/extend_a1_leverkusen.py
      - name: Download exact OpenStreetMap ways and junction nodes
        run: python scripts/import_a3_leverkusen.py --fetch-only
      - name: Extend actual A3 ways, motorway-link inventory and AS 23–26
        run: python scripts/import_a3_leverkusen.py
      - name: Attach exact A1 Leverkusen arms and A3-to-A1 motorway turns
        run: python scripts/extend_a1_leverkusen.py
      - name: Generate legal OSM local detours between Leverkusen exits
        run: python scripts/build_a3_leverkusen_detours.py
      - run: npm ci --no-audit --no-fund
      - name: Build and regression tests
        run: |
          npm run check
          python -m unittest discover -s scripts/tests -v
      - name: Synchronize published JavaScript with tested compiled output
        run: cp dist/*.js .
      - name: Create inspected Git objects without touching protected refs
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_a3_leverkusen_objects.py
      - name: Export OSM source, geometry and browser build for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leverkusen-osm-import-snapshot
          path: |
            data/a3-leverkusen-osm.json
            data/junction-audit.json
            data/extension-junctions.json
            src/geodata.ts
            src/network-extensions.ts
            src/leverkusen-detours-data.ts
            index.html
            '*.js'
          retention-days: 5
          if-no-files-found: error
