name: Karte und Stausimulation prüfen
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify OSM motorway geometry is never fabricated
        run: python -m unittest discover -s scripts/tests -v
      - run: git diff --exit-code -- app.js core.js geodata.js cartography.js lane-info.js lane-profiles.js selection.js events.js traffic.js traffic-physics.js traffic-cells.js spatial.js interchange.js network-report.js diversions.js detour-routing.js detour-flow.js map-callouts.js schedule-form.js junction-movements.js
      - name: Export SPCK preview
        uses: actions/upload-artifact@v4
        with:
          name: traffic-sinulator-1-1-preview
          path: |
            index.html
            '*.js'
            README.md
          retention-days: 3
