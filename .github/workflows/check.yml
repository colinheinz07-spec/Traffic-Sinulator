name: Karte und Stausimulation prüfen
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify OSM motorway geometry is never fabricated
        run: python -m unittest discover -s scripts/tests -v
      # Source changes are compiled/verified here; browser JS publication happens on main.\n      - run: git diff --check
      - name: Export SPCK preview
        uses: actions/upload-artifact@v4
        with:
          name: traffic-sinulator-1-1-preview
          path: |
            index.html
            '*.js'
            README.md
          retention-days: 3
