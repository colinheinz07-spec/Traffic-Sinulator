name: Karte und Stausimulation prüfen
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify OSM motorway geometry is never fabricated
        run: python -m unittest discover -s scripts/tests -v
      # Auf Feature-Zweigen wird der Quellcode geprueft; der Browser-Build wird auf main neu veroeffentlicht.
      - run: git diff --check
      - name: Export SPCK preview
        uses: actions/upload-artifact@v4
        with:
          name: traffic-sinulator-1-1-preview
          path: |
            index.html
            '*.js'
            '01_Strassennetz/*.js'
            '02_Verkehr/*.js'
            '03_Stauphysik/*.js'
            '04_Ereignisse/*.js'
            '05_Umleitungen/*.js'
            '06_Karte/*.js'
            README.md
          retention-days: 3
