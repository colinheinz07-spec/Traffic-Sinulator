name: Karte und Stausimulation prüfen
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify OSM motorway geometry is never fabricated
        run: python -m unittest discover -s scripts/tests -v
      - name: Publish SPCK 1.19.1 browser build once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'sync SPCK 1.19.1')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '*.js'
          if ! git diff --cached --quiet; then
            git commit -m 'build: compiled traffic 1.19.1 [skip ci]'
            git push origin HEAD:main
          fi
      - run: git diff --exit-code -- app.js core.js geodata.js cartography.js lane-info.js lane-profiles.js selection.js events.js traffic.js traffic-physics.js traffic-cells.js road-controls.js junction-traffic.js speed-delay.js traffic-view.js routed-traffic.js diversion-policy.js recurring-events.js auto-diversions.js bundled-detours.js spatial.js interchange.js interchange-journeys.js network-report.js diversions.js detour-routing.js detour-flow.js map-callouts.js schedule-form.js junction-movements.js
      - name: Export SPCK preview
        uses: actions/upload-artifact@v4
        with:
          name: traffic-sinulator-1-1-preview
          path: |
            index.html
            '*.js'
            README.md
          retention-days: 3
