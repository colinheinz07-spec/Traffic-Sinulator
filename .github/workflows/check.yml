name: Karte prüfen
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: git diff --exit-code -- app.js core.js geodata.js cartography.js

      - name: Export verified SPCK preview for browser testing
        uses: actions/upload-artifact@v4
        with:
          name: a3-a48-karte-limburg-preview
          path: |
            index.html
            app.js
            core.js
            geodata.js
            README.md
          retention-days: 3
