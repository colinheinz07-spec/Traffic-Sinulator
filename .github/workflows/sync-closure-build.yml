name: Sync browser bundle for closure fix
on:
  push:
    branches: [feat/generic-closures-ramp-directions]
    paths: ['.github/workflows/sync-closure-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/generic-closures-ramp-directions
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Commit version-fingerprinted browser files
        run: |
          git add index.html '*.js'
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: publish versioned closure and rest-area network modules'
          git fetch origin feat/generic-closures-ramp-directions
          git rebase origin/feat/generic-closures-ramp-directions
          git push origin HEAD:feat/generic-closures-ramp-directions
