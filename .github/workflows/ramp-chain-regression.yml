name: Ramp chain closure regression and published assets
on:
  push:
    branches:
      - fix/ramp-chain-closure-splits-20261106
  pull_request:
    branches: [main]
    paths:
      - 'src/closure-network.ts'
      - 'tests/generic-directional-closures.test.mjs'
      - '.github/workflows/ramp-chain-regression.yml'
permissions:
  contents: write
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Publish fingerprinted browser files from tested source (branch only)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.js' index.html
          if ! git diff --cached --quiet; then
            git commit -m "build: sync closure reachability browser assets"
            git push origin HEAD:fix/ramp-chain-closure-splits-20261106
          fi
