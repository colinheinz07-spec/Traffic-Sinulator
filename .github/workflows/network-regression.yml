name: Ereignisse und Rampen gezielt prüfen
on:
  push:
    branches: ['feature/network-flow-event-audit-20261102']
  pull_request:
    branches: [main]
jobs:
  network-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/network-flow-event-audit.test.mjs tests/full-network-event-placement.test.mjs tests/physical-colours-network-ramps.test.mjs tests/work-zones.test.mjs
