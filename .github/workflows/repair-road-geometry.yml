name: Verify and repair A3 / A48 motorway geometry
on:
  push:
    branches: ['feature/a3-geometrie-luecken-v04']
    paths:
      - 'scripts/fill_motorway_gaps.py'
      - '.github/workflows/repair-road-geometry.yml'
  workflow_dispatch:
jobs:
  fill-gaps:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve missing verified OpenStreetMap motorway segments
        run: python scripts/fill_motorway_gaps.py
      - run: npm install --no-audit --no-fund
      - name: TypeScript build and motorway geometry quality audit
        run: npm run check
      - name: Commit only verified OSM motorway geometry
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add src/geodata.ts geodata.js
          git diff --staged --quiet || (git commit -m 'data(osm): add actual missing A3/A48 motorway ways' && git push)
