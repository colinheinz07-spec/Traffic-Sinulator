name: Import audited AD lane geometries
on:
  workflow_dispatch:
  push:
    branches: ['feature/lane-audit-dern-bach']
    paths:
      - 'scripts/build_lane_profiles.py'
      - 'data/lane-audit.json'
      - '.github/workflows/lane-profile-import.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lane-audit-dern-bach
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get verified real ramp geometries and exact OSM lane counts
        run: python scripts/build_lane_profiles.py
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Commit verified lane provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lane-profiles.ts
          git diff --cached --quiet || (git commit -m "data: pinned OSM lane profiles for all AD Dernbach ramps" && git push)
