name: Bonn A555 A565 Netz und Rückstau
on:
  push:
    branches: [feature/a555-a565-bonn-north-network]
  pull_request:
    branches: [main]
jobs:
  bonn-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/a555-a565-network.test.mjs tests/physical-colours-network-ramps.test.mjs
