name: Directional closures and lane splits
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/generic-closures-ramp-directions]
    paths:
      - '.github/workflows/closure-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/generic-directional-closures.test.mjs tests/motorway-lane-splits.test.mjs
      - run: python -m unittest discover -s scripts/tests -p test_service_area_ramps.py -v
