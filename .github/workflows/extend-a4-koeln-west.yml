name: A4 Köln-West & Rückstau-Netz
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_a4_koeln_west.py'
      - 'scripts/extend_a4_koeln_west.py'
      - 'tests/a4-koeln-west.test.mjs'
      - '.github/workflows/extend-a4-koeln-west.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: a4-koeln-west-publisher
  cancel-in-progress: true
jobs:
  build-koeln-west:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch only new A4/A1 OSM tiles (reuse cached source)
        run: python scripts/fetch_a4_koeln_west.py
      - name: Retain original OSM source for reproducible reruns
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/a4-koeln-west-osm.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: cache verified A4 Köln-West OSM nodes [skip ci]'
            git push origin HEAD:main
          fi
      - name: Extend both A4 directions and verified A1 ramps
        run: python scripts/extend_a4_koeln_west.py
      - name: Compile directional local and motorway detours
        run: python scripts/build_extension_detours.py
      - name: Install and build browser
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Test western network and physical queue coupling
        run: |
          node --test tests/a4-koeln-west.test.mjs tests/a4-koeln-sued.test.mjs
          npx tsc --noEmit
      - name: Publish exact OSM, tests-compatible TS and compiled browser files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/a4-koeln-west-osm.json data/extension-junctions.json src/network-extensions.ts src/extension-detours-data.ts index.html '*.js'
          git diff --cached --stat
          git diff --cached --quiet || (git commit -m 'build: A4 Köln-West and connected A1 carriageways [skip ci]' && git push origin HEAD:main)
      - name: Full simulator regression suite
        run: npm run check
