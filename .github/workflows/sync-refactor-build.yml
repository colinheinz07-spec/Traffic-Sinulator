name: Sync browser modules for generic engine refactor
on:
  push:
    branches: [refactor/generic-motorway-engine]
    paths:
      - 'src/**'
      - 'scripts/build.mjs'
      - '.github/workflows/sync-refactor-build.yml'
permissions:
  contents: write
jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Sync browser-loadable compiled JavaScript
        run: cp dist/*.js ./
      - name: Commit browser assets only when changed
        run: |
          git add index.html ./*.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: sync published JS for universal route engine"
            git push origin HEAD:refactor/generic-motorway-engine
          fi
