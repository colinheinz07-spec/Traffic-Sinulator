name: Gemeinsame Aufnahmefähigkeit an Kreuzungen prüfen
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/shared-interchange-receiving]
    paths: ['.github/workflows/shared-interchange.yml']
jobs:
  pooled-receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/shared-interchange-receiving.test.mjs tests/network-merge-receiving.test.mjs tests/receiving-capacity-pooling.test.mjs tests/heumar-network.test.mjs
