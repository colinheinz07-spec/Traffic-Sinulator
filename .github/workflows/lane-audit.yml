name: Audit A3 A48 lane tags
on:
  workflow_dispatch:
  push:
    branches: ['feature/lane-audit-dern-bach']
    paths:
      - 'scripts/audit_lanes.py'
      - '.github/workflows/lane-audit.yml'
jobs:
  lane-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current source tags and compare lanes
        run: python scripts/audit_lanes.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-osm-lane-audit
          path: data/lane-audit.json
          retention-days: 7
